[workspace]
members = ["crates/shr-sampler-core", "crates/shr-sampler-cli"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/PaolaShultz/shr-sampler"

[workspace.dependencies]
alsa = "0.12.1"
hound = "3.5.1"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
signal-hook = { version = "0.4.4", default-features = false }
thiserror = "2.0.18"
